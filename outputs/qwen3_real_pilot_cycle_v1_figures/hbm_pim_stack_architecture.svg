    <text x="1525" y="818" text-anchor="middle" class="tiny">B0</text><text x="1592" y="818" text-anchor="middle" class="tiny">B1</text>
    <text x="1525" y="866" text-anchor="middle" class="tiny">B2</text><text x="1592" y="866" text-anchor="middle" class="tiny">B3</text>
    <!-- BG 5 -->
    <rect x="1660" y="746" width="158" height="150" rx="5" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="1739" y="775" text-anchor="middle" class="label">BG 5</text>
    <rect x="1678" y="794" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/><rect x="1745" y="794" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/>
