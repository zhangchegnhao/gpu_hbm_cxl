<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Current HBM-PIM hierarchy and cycle-v1 request paths</title>
  <desc id="desc">One simulated GPU connects to eight local HBM-PIM stacks. A stack has sixteen channels, each channel has two pseudo-channels, and each pseudo-channel has six bank groups with four banks each.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 34px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .section { font: 700 23px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .label { font: 600 18px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .small { font: 500 15px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .tiny { font: 500 13px "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .white { fill: #ffffff; }
      .muted { fill: #64748b; }
      .num { font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f8fafc"/>
  <text x="70" y="58" class="title">当前模拟的 HBM-PIM 层级结构</text>
  <text x="70" y="91" class="subtitle">1 GPU + 8 Local HBM-PIM Stacks · 96 GB 可用容量 · cycle-v1 混合请求级时序</text>

  <!-- System overview -->
  <rect x="70" y="126" width="1780" height="198" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="161" class="section">系统级</text>
  <rect x="100" y="184" width="280" height="92" rx="6" fill="#16324f"/>
  <text x="240" y="221" text-anchor="middle" class="label white">1 × GPU</text>
  <text x="240" y="250" text-anchor="middle" class="small white">2250 TFLOPS · 解析计算模型</text>

  <line x1="380" y1="230" x2="476" y2="230" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="428" y="208" text-anchor="middle" class="tiny">GPU HBM READ</text>
  <text x="428" y="264" text-anchor="middle" class="tiny">PIM命令</text>

  <g aria-label="Eight HBM-PIM stacks">
    <rect x="500" y="177" width="150" height="106" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="4"/>
    <text x="575" y="213" text-anchor="middle" class="label">Stack 0</text>
    <text x="575" y="240" text-anchor="middle" class="small">16 Channels</text>
    <text x="575" y="265" text-anchor="middle" class="tiny">当前展开</text>
    <rect x="666" y="188" width="130" height="84" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="812" y="188" width="130" height="84" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="958" y="188" width="130" height="84" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="1104" y="188" width="130" height="84" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="1250" y="188" width="130" height="84" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="1396" y="188" width="130" height="84" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="1542" y="188" width="130" height="84" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="731" y="226" text-anchor="middle" class="small">Stack 1</text>
    <text x="877" y="226" text-anchor="middle" class="small">Stack 2</text>
    <text x="1023" y="226" text-anchor="middle" class="small">Stack 3</text>
    <text x="1169" y="226" text-anchor="middle" class="small">Stack 4</text>
    <text x="1315" y="226" text-anchor="middle" class="small">Stack 5</text>
    <text x="1461" y="226" text-anchor="middle" class="small">Stack 6</text>
    <text x="1607" y="226" text-anchor="middle" class="small">Stack 7</text>
    <text x="1169" y="255" text-anchor="middle" class="tiny">其余Stack结构相同</text>
  </g>
  <path d="M 500 289 L 500 295 L 1672 295 L 1672 289" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="1086" y="317" text-anchor="middle" class="tiny num">8 Stacks × 32 PCH = 256 PCH · 6144 Banks · 总容量 96 GB</text>

  <!-- Expansion connectors -->
  <path d="M 575 283 C 575 326, 370 326, 370 355" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGreen)"/>

  <!-- Stack expansion -->
  <rect x="70" y="356" width="590" height="646" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <text x="98" y="395" class="section">① 单个 HBM-PIM Stack</text>
  <text x="98" y="424" class="small num">16 Channels · 32 Pseudo-Channels · 768 Banks</text>
  <text x="98" y="449" class="tiny">按总容量均分约 12 GB / Stack</text>

  <g aria-label="Sixteen channels in one stack">
    <!-- Row 1 -->
    <rect x="100" y="480" width="118" height="82" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <rect x="232" y="480" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="364" y="480" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="496" y="480" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <!-- Row 2 -->
    <rect x="100" y="578" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="232" y="578" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="364" y="578" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="496" y="578" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <!-- Row 3 -->
    <rect x="100" y="676" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="232" y="676" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="364" y="676" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="496" y="676" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <!-- Row 4 -->
    <rect x="100" y="774" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="232" y="774" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="364" y="774" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="496" y="774" width="118" height="82" rx="4" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <text x="159" y="515" text-anchor="middle" class="label">Channel 0</text>
    <text x="159" y="541" text-anchor="middle" class="tiny">当前展开</text>
    <text x="291" y="525" text-anchor="middle" class="small">Channel 1</text>
    <text x="423" y="525" text-anchor="middle" class="small">Channel 2</text>
    <text x="555" y="525" text-anchor="middle" class="small">Channel 3</text>
    <text x="159" y="623" text-anchor="middle" class="small">Channel 4</text>
    <text x="291" y="623" text-anchor="middle" class="small">Channel 5</text>
    <text x="423" y="623" text-anchor="middle" class="small">Channel 6</text>
    <text x="555" y="623" text-anchor="middle" class="small">Channel 7</text>
    <text x="159" y="721" text-anchor="middle" class="small">Channel 8</text>
    <text x="291" y="721" text-anchor="middle" class="small">Channel 9</text>
    <text x="423" y="721" text-anchor="middle" class="small">Channel 10</text>
    <text x="555" y="721" text-anchor="middle" class="small">Channel 11</text>
    <text x="159" y="819" text-anchor="middle" class="small">Channel 12</text>
    <text x="291" y="819" text-anchor="middle" class="small">Channel 13</text>
    <text x="423" y="819" text-anchor="middle" class="small">Channel 14</text>
    <text x="555" y="819" text-anchor="middle" class="small">Channel 15</text>
  </g>
  <rect x="100" y="887" width="514" height="78" rx="5" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/>
  <text x="357" y="918" text-anchor="middle" class="label">HBM-PIM Stack Interface</text>
  <text x="357" y="945" text-anchor="middle" class="small">GPU普通访存 + PIM命令均进入对应Channel Controller</text>

  <!-- Channel connector -->
  <path d="M 159 480 C 420 454, 650 440, 712 440" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/>

  <!-- Channel expansion -->
  <rect x="720" y="356" width="500" height="646" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="748" y="395" class="section">② 单个 Channel</text>
  <text x="748" y="424" class="small num">2 Pseudo-Channels · 48 Banks</text>

  <rect x="758" y="463" width="424" height="128" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="970" y="496" text-anchor="middle" class="label">Channel Controller</text>
  <rect x="790" y="516" width="160" height="48" rx="4" fill="#dbeafe"/>
  <rect x="990" y="516" width="160" height="48" rx="4" fill="#ccfbf1"/>
  <text x="870" y="546" text-anchor="middle" class="small">Row命令槽</text>
  <text x="1070" y="546" text-anchor="middle" class="small">Column命令槽</text>

  <path d="M 850 620 L 850 680" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1090 620 L 1090 680" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="756" y="686" width="200" height="170" rx="5" fill="#fff7ed" stroke="#d97706" stroke-width="4"/>
  <rect x="984" y="686" width="200" height="170" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="856" y="724" text-anchor="middle" class="label">PCH 0</text>
  <text x="856" y="751" text-anchor="middle" class="tiny">当前展开</text>
  <text x="856" y="790" text-anchor="middle" class="small">6 Bank Groups</text>
  <text x="856" y="817" text-anchor="middle" class="small">24 Banks</text>
  <text x="1084" y="724" text-anchor="middle" class="label">PCH 1</text>
  <text x="1084" y="790" text-anchor="middle" class="small">6 Bank Groups</text>
  <text x="1084" y="817" text-anchor="middle" class="small">24 Banks</text>

  <rect x="756" y="887" width="428" height="78" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="970" y="917" text-anchor="middle" class="small">共享Column槽：GPU RD/WR 与</text>
  <text x="970" y="944" text-anchor="middle" class="small">PIM_GWRITE / PIM_MAC / PIM_READ 交替仲裁</text>

  <!-- PCH connector -->
  <path d="M 856 856 L 856 872 L 1240 872 L 1240 440 L 1260 440" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowOrange)"/>

  <!-- PCH expansion -->
  <rect x="1270" y="356" width="580" height="646" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
  <text x="1298" y="395" class="section">③ 单个 Pseudo-Channel</text>
  <text x="1298" y="424" class="small num">1 SID · 6 Bank Groups × 4 Banks = 24 Banks</text>

  <rect x="1300" y="458" width="520" height="82" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1560" y="489" text-anchor="middle" class="label">PIM命令逻辑（all-bank wave）</text>
  <text x="1560" y="518" text-anchor="middle" class="small">GWRITE → MAC → READ，作用于本PCH的24个Bank</text>

  <g aria-label="Six bank groups with four banks each">
    <!-- BG 0 -->
    <rect x="1300" y="574" width="158" height="150" rx="5" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="1379" y="603" text-anchor="middle" class="label">BG 0</text>
    <rect x="1318" y="622" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/>
    <rect x="1385" y="622" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/>
    <rect x="1318" y="670" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/>
    <rect x="1385" y="670" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/>
    <text x="1345" y="646" text-anchor="middle" class="tiny">B0</text><text x="1412" y="646" text-anchor="middle" class="tiny">B1</text>
    <text x="1345" y="694" text-anchor="middle" class="tiny">B2</text><text x="1412" y="694" text-anchor="middle" class="tiny">B3</text>
    <!-- BG 1 -->
    <rect x="1480" y="574" width="158" height="150" rx="5" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="1559" y="603" text-anchor="middle" class="label">BG 1</text>
    <rect x="1498" y="622" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/><rect x="1565" y="622" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/>
    <rect x="1498" y="670" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/><rect x="1565" y="670" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/>
    <text x="1525" y="646" text-anchor="middle" class="tiny">B0</text><text x="1592" y="646" text-anchor="middle" class="tiny">B1</text>
    <text x="1525" y="694" text-anchor="middle" class="tiny">B2</text><text x="1592" y="694" text-anchor="middle" class="tiny">B3</text>
    <!-- BG 2 -->
    <rect x="1660" y="574" width="158" height="150" rx="5" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
    <text x="1739" y="603" text-anchor="middle" class="label">BG 2</text>
    <rect x="1678" y="622" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/><rect x="1745" y="622" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/>
    <rect x="1678" y="670" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/><rect x="1745" y="670" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/>
    <text x="1705" y="646" text-anchor="middle" class="tiny">B0</text><text x="1772" y="646" text-anchor="middle" class="tiny">B1</text>
    <text x="1705" y="694" text-anchor="middle" class="tiny">B2</text><text x="1772" y="694" text-anchor="middle" class="tiny">B3</text>
    <!-- BG 3 -->
