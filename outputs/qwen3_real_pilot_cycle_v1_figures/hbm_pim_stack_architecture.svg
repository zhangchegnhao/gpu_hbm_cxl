    <rect x="1318" y="842" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/><rect x="1385" y="842" width="55" height="36" rx="3" fill="#fee2e2" stroke="#c2410c"/>
    <text x="1345" y="818" text-anchor="middle" class="tiny">B0</text><text x="1412" y="818" text-anchor="middle" class="tiny">B1</text>
    <text x="1345" y="866" text-anchor="middle" class="tiny">B2</text><text x="1412" y="866" text-anchor="middle" class="tiny">B3</text>
