  <rect x="1300" y="921" width="250" height="54" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <rect x="1570" y="921" width="250" height="54" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="1425" y="944" text-anchor="middle" class="small">普通GPU Row Buffer</text>
  <text x="1425" y="963" text-anchor="middle" class="tiny">Ramulator DRAMDevice状态</text>
  <text x="1695" y="944" text-anchor="middle" class="small">逻辑PIM Row Buffer</text>
  <text x="1695" y="963" text-anchor="middle" class="tiny">独立open-row状态</text>

  <!-- Footer -->
  <line x1="70" y1="1026" x2="1850" y2="1026" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="1053" class="tiny">层级汇总：8 Stacks × 16 Channels × 2 PCH × 6 Bank Groups × 4 Banks = 6144 Banks</text>
  <text x="1850" y="1053" text-anchor="end" class="tiny">配置：HBM3_8Gb_8hi · HBM3_6400Mbps · 32-byte transaction · dual_row_buffer=true</text>
</svg>
