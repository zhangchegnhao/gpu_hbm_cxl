<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Motivation: Limitations of GPU-Local HBM-PIM for Multi-GPU MoE Inference</title>
<desc id="figure-description">Conceptual motivation, not measured performance. (a) A token on GPU0 reaches Expert E7 only through GPU1 and its private local HBM-PIM1. (b) Equal-height schematic HBM-capacity bars show growing KV-cache capacity displacing space available to expert weights at increasing context lengths; no measured occupancy is asserted. (c) E7 requests of 2, 3, 2, and 1 tokens from four GPUs aggregate to 8. All workload bars use 15 drawing units per token. Local and shared PIM domains are complementary. No proposed multi-GPU or CXL architecture is depicted or claimed implemented.</desc>
<metadata>{"type": "conceptual motivation figure", "capacity_data": "qualitative schematic; not measured", "context_labels": ["2K", "8K", "16K", "32K"], "local_E7_tokens": [2, 3, 2, 1], "aggregated_E7_tokens": 8, "workload_bar_units_per_token": 15, "hardware_scope": "conceptual observation only; no implementation claim"}</metadata>
